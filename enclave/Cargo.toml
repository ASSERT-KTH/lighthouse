[package]
name = "enclave"
version = "0.1.0"
edition = "2021"

[features]
# The `tstd_enclave` feature is requested by the automata_sgx_sdk
tstd_enclave = ["automata-sgx-sdk/tstd_enclave"]

[lib]
name = "enclave"
crate-type = ["staticlib"]

[dependencies]
automata-sgx-sdk = { git = "https://github.com/automata-network/automata-sgx-sdk", branch = "main" }
# Use external libraries in the enclave
# serde = { version = "1", features = ["derive"] }
# serde_json = { version = "1" }
# hex = "0.4"
# alloy-chains = "=0.1.57"
# blst = { version = "=0.3.13"}
# automata-sgx-sdk = { workspace = true }
# serde = { workspace = true }
# serde_json = { workspace = true }
# hex = { workspace = true }
# alloy-chains = { workspace = true }
bls = { workspace = true }

